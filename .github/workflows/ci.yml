name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Validate manifest + version sync
        run: npm run lint:manifest

      - name: Run regression tests
        run: npm test

      - name: Build production zip
        run: npm run package

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: xpath-pom-zip-node${{ matrix.node }}
          path: release/*.zip
          if-no-files-found: error
